<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 018</title>
  <desc>Minimal layered paper-cut editorial with one visual anchor, sparse foreground, midground, and background paper layers, warm-ivory space, matte fibre, clear edges, soft contact shadows, complete microtype, and five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="25" height="23" patternUnits="userSpaceOnUse">
      <path d="M2 7L10 6M14 18L23 17M6 22L11 21" stroke="#282A28" stroke-opacity=".04" stroke-width=".7"/>
      <circle cx="19" cy="5" r=".5" fill="#282A28" fill-opacity=".05"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4C4740" flood-opacity=".22"/>
    </filter>
    <filter id="layerShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#4C4740" flood-opacity=".2"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F1EEE7"/>
    <rect width="1200" height="400" fill="url(#paper)"/>

    <g transform="translate(690 58)">
      <path d="M8 232C72 201 130 202 182 172C244 136 301 121 417 137V275H8V232Z" fill="#D9D2C4" filter="url(#layerShadow)"/>
      <path d="M8 259C85 218 165 228 229 199C294 170 357 170 442 193V286H8V259Z" fill="#7FA39A" filter="url(#layerShadow)"/>
      <path d="M105 239C91 192 99 132 134 94C166 59 213 50 253 68C296 87 321 131 316 179C312 223 286 257 247 276H148C129 267 114 255 105 239Z" fill="#E1A06E" filter="url(#softShadow)"/>
      <path d="M147 90C179 70 221 69 254 85C234 103 216 126 205 152C189 189 187 229 195 268H148C129 256 115 240 107 220C91 179 99 128 127 99L147 90Z" fill="#C96F56" filter="url(#layerShadow)"/>
      <path d="M252 85C285 105 304 140 302 178C299 220 276 250 241 268H195C188 228 190 190 205 153C216 126 232 103 252 85Z" fill="#F0D5A1" filter="url(#layerShadow)"/>
      <path d="M152 170C173 153 199 143 227 144C252 145 273 155 290 173C265 166 243 168 221 181C196 195 179 217 169 242C153 223 145 197 152 170Z" fill="#6F8E9B" filter="url(#layerShadow)"/>
      <path d="M338 104L405 73L430 129L370 151Z" fill="#E6BE78" filter="url(#layerShadow)"/>
      <path d="M340 103L370 151" stroke="#5B5A54" stroke-opacity=".28" stroke-width="1.4"/>
      <text x="337" y="53" fill="#2F302E" font-family="Georgia, serif" font-size="16" font-weight="700">LAYERED MEMORY</text>
      <text x="339" y="71" fill="#2F302E" fill-opacity=".65" font-family="Arial, sans-serif" font-size="7" font-weight="800" letter-spacing="1.8">FG / MG / BG · 018</text>
      <text x="50" y="116" fill="#2F302E" fill-opacity=".72" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" transform="rotate(-90 50 116)">ANCHOR / CUT / SPACE</text>
      <path d="M337 82H429" stroke="#2F302E" stroke-opacity=".28" stroke-width="1"/>
    </g>

    <g transform="translate(692 302)">
      <path d="M0 0H418" stroke="#2F302E" stroke-opacity=".3" stroke-width="1.2"/>
      <text x="0" y="20" fill="#2F302E" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2.2">ANCHOR → DEPTH LAYERS → MICROTYPE / 018</text>
    </g>

    <text x="1160" y="36" text-anchor="end" fill="#2F302E" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
    <text x="1160" y="53" text-anchor="end" direction="rtl" fill="#2F302E" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>

  <g transform="translate(64 54)">
    <text x="0" y="20" fill="#2F302E" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="111" fill="#2F302E" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL <tspan fill="#C96F56">018</tspan></text>
    <text x="2" y="151" fill="#2F302E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">ANCHOR · FEW LAYERS · MICROTYPE</text>
    <text x="2" y="193" fill="#2F302E" font-family="sans-serif" font-size="18" font-weight="700">极简层叠剪纸微排版 · 纸艺记忆与编辑秩序</text>
    <text x="2" y="222" fill="#2F302E" fill-opacity=".72" font-family="sans-serif" font-size="14" font-weight="600">重層切り紙マイクロタイプ · 레이어드 페이퍼컷 마이크로타입</text>
    <text x="2" y="251" fill="#2F302E" fill-opacity=".72" font-family="Arial, sans-serif" font-size="14" font-weight="600">قص ورقي طبقي وميكروتايب</text>
  </g>

  <g transform="translate(64 327)">
    <rect width="143" height="37" rx="7" fill="#2F302E"/>
    <text x="71.5" y="24" text-anchor="middle" fill="#F1EEE7" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE-LED</text>
    <rect x="155" width="106" height="37" rx="7" fill="#C96F56"/>
    <text x="208" y="24" text-anchor="middle" fill="#F1EEE7" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="273" width="143" height="37" rx="7" fill="#A9C6BC"/>
    <text x="344.5" y="24" text-anchor="middle" fill="#2F302E" font-family="Courier New, monospace" font-size="12" font-weight="900">FEW LAYERS</text>
    <rect x="428" width="147" height="37" rx="7" fill="#F1EEE7" stroke="#2F302E" stroke-width="1.5"/>
    <text x="501.5" y="24" text-anchor="middle" fill="#2F302E" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text>
  </g>
</svg>
